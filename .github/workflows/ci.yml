name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  # Pushes to master: plain build and tests. Version tagging and the documentation wait for this job.
  # Pull requests are covered by the build-and-test-sanitized job.
  build-and-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      CMAKE_BUILD_TYPE: Debug

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get remove libunwind-*
          sudo apt-get install -y \
            cmake \
            g++ \
            libboost-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base

      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} -DBUILD_TESTS=ON -DBUILD_EXAMPLES=ON

      - name: Build the project
        run: cmake --build build --parallel "$(nproc)"

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  # Pull requests to master: build and run the tests with AddressSanitizer (incl. LeakSanitizer)
  # and UndefinedBehaviorSanitizer. Any finding fails the job. The examples are built too, so a pull
  # request cannot break them before the push build on master.
  build-and-test-sanitized:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    env:
      SANITIZE_FLAGS: -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: print_stacktrace=1

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get remove libunwind-*
          sudo apt-get install -y \
            cmake \
            g++ \
            libboost-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=ON \
            -DCMAKE_CXX_FLAGS="$SANITIZE_FLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$SANITIZE_FLAGS" \
            -DCMAKE_SHARED_LINKER_FLAGS="$SANITIZE_FLAGS"

      - name: Build the project
        run: cmake --build build --parallel "$(nproc)"

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  # Pull requests to master: check that all C++ files are formatted according to .clang-format.
  # Runs after the sanitized build, so a pull request gets the build and test results first.
  check-formatting:
    if: github.event_name == 'pull_request'
    needs: build-and-test-sanitized
    runs-on: ubuntu-latest

    env:
      # .clang-format needs 21+; the same version as locally, because versions format differently
      CLANG_FORMAT_VERSION: 21.1.8

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install clang-format
        run: pipx install "clang-format==${{ env.CLANG_FORMAT_VERSION }}"

      - name: Check formatting
        run: git ls-files -z '*.cpp' '*.hpp' | xargs -0 -r clang-format --dry-run --Werror
